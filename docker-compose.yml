services:

  consul-examen:
    image: hashicorp/consul:latest
    container_name: examen-consul
    ports:
      - "8510:8500"
    command: agent -dev -client=0.0.0.0

  mysql-examen:
    image: mysql:8.0
    container_name: examen-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql123
      MYSQL_DATABASE: libros_db
    ports:
      - "3310:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql123"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-valencia-lib-prestamos:
    build: ./ms-valencia-lib-prestamos
    container_name: examen-ms-valencia-lib-prestamos
    ports:
      - "8091:8081"
    volumes:
      - ./central-config:/app/central-config
    depends_on:
      mysql-examen:
        condition: service_healthy
      consul-examen:
        condition: service_started

  ms-valencia-lib-libros:
    build: ./ms-valencia-lib-libros
    container_name: examen-ms-valencia-lib-libros
    ports:
      - "8092:8082"
    volumes:
      - ./central-config:/app/central-config
    depends_on:
      mysql-examen:
        condition: service_healthy
      consul-examen:
        condition: service_started

  ms-valencia-lib-reserva:
    build: ./ms-valencia-lib-reserva
    container_name: examen-ms-valencia-lib-reserva
    ports:
      - "8093:8083"
    volumes:
      - ./central-config:/app/central-config
    depends_on:
      mysql-examen:
        condition: service_healthy
      ms-valencia-lib-libros:
        condition: service_started
      consul-examen:
        condition: service_started

  api-gateway:
    build: ./api.gateway
    container_name: examen-api-gateway
    ports:
      - "8040:8030"
    depends_on:
      - consul-examen
      - ms-valencia-lib-prestamos
      - ms-valencia-lib-libros
      - ms-valencia-lib-reserva

  consul-registrator:
    image: curlimages/curl:latest
    container_name: examen-consul-registrator
    depends_on:
      - consul-examen
      - ms-valencia-lib-prestamos
      - ms-valencia-lib-libros
      - ms-valencia-lib-reserva
    entrypoint: >
      sh -c "
      sleep 40 &&

      curl -X PUT http://consul-examen:8500/v1/agent/service/register
      -H 'Content-Type: application/json'
      -d '{\"Name\":\"ms-valencia-lib-prestamos\",\"ID\":\"ms-valencia-lib-prestamos-1\",\"Address\":\"ms-valencia-lib-prestamos\",\"Port\":8081,\"Check\":{\"HTTP\":\"http://ms-valencia-lib-prestamos:8081/q/health\",\"Interval\":\"10s\"}}' &&

      curl -X PUT http://consul-examen:8500/v1/agent/service/register
      -H 'Content-Type: application/json'
      -d '{\"Name\":\"ms-valencia-lib-libros\",\"ID\":\"ms-valencia-lib-libros-1\",\"Address\":\"ms-valencia-lib-libros\",\"Port\":8082,\"Check\":{\"HTTP\":\"http://ms-valencia-lib-libros:8082/q/health\",\"Interval\":\"10s\"}}' &&

      curl -X PUT http://consul-examen:8500/v1/agent/service/register
      -H 'Content-Type: application/json'
      -d '{\"Name\":\"ms-valencia-lib-reserva\",\"ID\":\"ms-valencia-lib-reserva-1\",\"Address\":\"ms-valencia-lib-reserva\",\"Port\":8083,\"Check\":{\"HTTP\":\"http://ms-valencia-lib-reserva:8083/q/health\",\"Interval\":\"10s\"}}' &&

      echo 'Servicios registrados en Consul correctamente'
      "
